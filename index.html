<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>混-KON-</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container-wide">

  <div class="layout-grid">
    <div class="col-left">
      <div class="card">
        <div class="header-line">🤖 AI提案を貼り付け <span>ー AIが返した提案をそのまま貼り付けでOK</span></div>

        <div class="input-group">
          <label>📅 日付:</label>
          <input type="date" id="aiDate" />
        </div>

        <div class="input-group">
          <label>🎨 作りたい色名:</label>
          <input type="text" id="aiColorName" placeholder="例: 夢見る白、深海ブルー" />
        </div>

        <div class="input-group">
          <label>🤖 使用AI:</label>
          <select id="aiName">
            <option value="ChatGPT">ChatGPT</option>
            <option value="Gemini">Gemini</option>
            <option value="Copilot">Copilot</option>
            <option value="Claude">Claude</option>
            <option value="Perplexity">Perplexity</option>
            <option value="その他">その他</option>
          </select>
        </div>

        <textarea id="pasteArea" placeholder="例: ホワイト70%, ライトイエロー15%, ラベンダー10%, ピンク5%"></textarea>
        <button class="btn-paste" onclick="parseAIResponse()">✨ AI提案を反映する</button>
      </div>

      <div class="card">
        <h1 class="title-inline">🎨 混-KON-</h1>
        <p class="subtitle-inline">33色から自由に混ぜてオリジナルカラーを作ろう</p>
      </div>
    </div>

    <div class="col-right">
      <div class="card">
        <div class="header-line">🤖 AIに依頼する <span>ー 他AI（ChatGPT等）に投げるプロンプトをコピーします</span></div>

        <div class="input-group">
          <label>🎨 作りたい色名:</label>
          <input type="text" id="promptColorName" placeholder="例: 夢見る白、深海ブルー" />
        </div>

        <button class="btn-copy-prompt" onclick="copyPrompt()">📋 AI用プロンプトをコピー</button>
      </div>

      <!--
      <div class="card">
        <button class="btn-save" onclick="saveAsHTML()">💾 このツールを保存</button>
      </div>
      -->

      <div class="card">
        <div class="section-title">✋ 手動で混色</div>

        <div class="input-group">
          <label>色を選択（タップで一覧表示）:</label>
          <div class="custom-select">
            <div class="select-display" onclick="toggleOptions()">
              <div class="color-indicator" id="colorIndicator" style="background: #FFFFFF;"></div>
              <span id="selectedColorText">ホワイト (#FFFFFF)</span>
            </div>
            <div class="options-list" id="optionsList"></div>
          </div>
        </div>

        <div class="ratio-control">
          <label style="min-width: 60px; font-weight: 600;">配合量:</label>
          <input type="range" id="ratioSlider" min="5" max="100" value="50" step="5">
          <span class="ratio-value" id="ratioValue">50%</span>
        </div>

        <button class="btn-add" onclick="addColor()">➕ この色を追加</button>

        <div id="manualRecipeList" style="margin-top: 15px;"></div>

        <button class="btn-reset" onclick="resetManual()">🔄 手動調整をリセット</button>
      </div>
    </div>
  </div>

  <div class="card" id="aiSummaryCard" style="display: none;">
    <div class="result-box result-box-large">
      <div class="result-header">
        <div class="result-meta">📅 <strong id="displayDate">-</strong></div>
        <div class="result-meta">🎨 <strong id="displayColorName">-</strong></div>
        <div class="result-meta">🤖 <strong id="displayAiName">-</strong></div>
      </div>

      <div class="color-display" id="aiColorDisplay" style="background: #cccccc;">
        <span class="hex-code" id="aiHexCode">#CCCCCC</span>
      </div>

      <div class="recipe-section" id="aiRecipeSection"></div>

      <button class="btn-copy-info" onclick="copyAIInfo()">📋 この情報をテキストでコピー</button>
    </div>
  </div>

  <div class="card" id="manualSummaryCard" style="display: none;">
    <div class="result-box result-box-manual">
      <div class="result-header">
        <div class="result-meta">✋ <strong>手動調整の結果</strong></div>
        <div class="result-meta">📅 <strong id="manualDisplayDate">-</strong></div>
      </div>

      <div class="color-display" id="manualColorDisplay" style="background: #cccccc;">
        <span class="hex-code" id="manualHexCode">#CCCCCC</span>
      </div>

      <div class="recipe-section" id="manualRecipeSection"></div>

      <button class="btn-copy-info" onclick="copyManualInfo()">📋 この情報をテキストでコピー</button>
      <button class="btn-copy-info" onclick="copyManualForAI()" style="background: #8b5cf6; margin-top: 10px;">🔄 AI入力用にコピー</button>
    </div>
  </div>
</div>

<button class="compare-toggle-btn" id="compareToggleBtn" onclick="toggleCompare()">⚖️ 比較</button>

<div class="floating-compare hidden" id="floatingCompare">
  <div class="floating-compare-title">
    ⚖️ 比較
    <span class="floating-compare-close" onclick="toggleCompare()">✕</span>
  </div>
  <div class="compare-container">
    <div class="compare-box ai">
      <div class="compare-label" style="color: #8b5cf6;">🤖 AI提案</div>
      <div class="compare-color" id="compareAiColor" style="background: #cccccc;">
        <span class="hex-code" style="font-size: 14px;">-</span>
      </div>
      <div class="compare-hex" id="compareAiHex">反映してください</div>
    </div>

    <div class="compare-box manual">
      <div class="compare-label" style="color: #10b981;">✋ 手動調整</div>
      <div class="compare-color" id="compareManualColor" style="background: #cccccc;">
        <span class="hex-code" style="font-size: 14px;">-</span>
      </div>
      <div class="compare-hex" id="compareManualHex">追加してください</div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="script.js"></script>
</body>
</html>
